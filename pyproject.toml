[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn"
description = "A local-first store for working docs and handoffs, synced over ssh and accessible over MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "cryptography>=42",
    "mcp>=2.3,<3",
]

[project.scripts]
cairn = "cairn.cli:main"

[project.optional-dependencies]
serve = [
    "markdown-it-py>=3",
]

[tool.hatch.version]
path = "src/cairn/__init__.py"

[dependency-groups]
dev = [
    "markdown-it-py>=3",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "DTZ"]
